<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ness Global Group — Coming Soon</title>
<meta name="description" content="Ness Global Group. Silk and satin woven with gold and silver thread. Our online home is being woven — launching soon.">
<link rel="canonical" href="https://www.nessglobalgroup.com/">

<meta property="og:type" content="website">

<meta property="og:description" content="Silk and satin woven with gold and silver thread. Launching soon.">
<meta property="og:url" content="https://www.nessglobalgroup.com/">
<meta property="og:image" content="https://www.nessglobalgroup.com/assets/img/og.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/favicon.png">
<link rel="preload" href="assets/fonts/cormorant-garamond-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/img/tag.webp" as="image">

<style>
/* ============================================================
   Ness Global Group — nessglobalgroup.com
   Coming soon / placeholder homepage
   Built by Webszövő
   ============================================================ */

@font-face{
  font-family:"Cormorant Garamond";
  font-style:normal;
  font-display:swap;
  font-weight:300 700;
  src:url("assets/fonts/cormorant-garamond-latin-wght-normal.woff2") format("woff2-variations");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}

:root{
  --ink:#120D07;          /* deep lacquer brown-black */
  --ink-2:#1C150C;
  --gold:#D6AC5E;         /* mid gold, sampled from the tag */
  --gold-light:#F2E0A8;   /* highlight gold */
  --parchment:#E8DCC4;
  --muted:rgba(232,220,196,.58);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{
  margin:0;
  min-height:100svh;
  background:var(--ink);
  color:var(--parchment);
  font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  overflow-x:clip;
}
img{display:block;max-width:100%}
a{color:inherit}

/* soft warm glow behind the tag */
body::before{
  content:"";
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60% 45% at 50% 42%,rgba(214,172,94,.13),transparent 70%);
}

.page{
  position:relative;z-index:1;
  flex:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(1.4rem,3.2vh,2.4rem);
  padding:clamp(1.5rem,4vh,3rem) clamp(1.25rem,5vw,3rem);
  text-align:center;
}

/* ---------- the hang tag ---------- */
.tag{
  position:relative;
  width:min(380px,78vw);
  max-height:50svh;
  aspect-ratio:972/1619;
  overflow:hidden;
  box-shadow:
    0 2px 0 rgba(242,224,168,.18),
    0 30px 70px -20px rgba(0,0,0,.85),
    0 0 0 1px rgba(214,172,94,.28);
  opacity:0;
  animation:tagIn 1.4s cubic-bezier(.22,1,.36,1) .15s forwards;
}
.tag img{width:100%;height:100%;object-fit:cover;object-position:center 38%}
@keyframes tagIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}

/* ---------- wordmark lockup ---------- */
.lockup{opacity:0;animation:fadeUp 1.1s ease .75s forwards}
.lockup__rule{
  width:clamp(64px,12vw,120px);height:1px;margin:0 auto 1.35rem;
  background:linear-gradient(to right,transparent,var(--gold),transparent);
}
.lockup h1{
  margin:0;
  font-weight:400;
  font-size:clamp(1.45rem,4.4vw,2.5rem);
  letter-spacing:.34em;
  text-indent:.34em;          /* balances the trailing letter-space */
  text-transform:uppercase;
  line-height:1.2;
  background:linear-gradient(175deg,var(--gold-light),var(--gold) 55%,#A87B36);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
}
.lockup .tagline{
  margin:1.15rem 0 0;
  font-size:clamp(.95rem,2vw,1.15rem);
  font-style:italic;
  color:var(--muted);
  letter-spacing:.02em;
}

/* ---------- status ---------- */
.status{opacity:0;animation:fadeUp 1.1s ease 1.05s forwards}
.status p{
  margin:1.6rem auto 0;
  white-space:nowrap;
  font-size:clamp(.68rem,1.5vw,.78rem);
  letter-spacing:.3em;
  text-indent:.3em;
  text-transform:uppercase;
  color:var(--muted);
}
.status .mail{
  display:inline-block;margin-top:1.25rem;
  font-size:clamp(.95rem,2vw,1.1rem);
  letter-spacing:.06em;
  color:var(--gold);
  text-decoration:none;
  border-bottom:1px solid rgba(214,172,94,.35);
  padding-bottom:.2rem;
  transition:color .3s ease,border-color .3s ease;
}
.status .mail:hover,.status .mail:focus-visible{color:var(--gold-light);border-bottom-color:var(--gold-light)}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .tag,.lockup,.status{animation:none;opacity:1}
}

/* ---------- footer ---------- */
.foot{
  position:relative;z-index:1;
  padding:0 1.25rem clamp(1.25rem,3vh,2rem);
  text-align:center;
  font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(232,220,196,.3);
}

:focus-visible{outline:1px solid var(--gold);outline-offset:4px}

/* shorter screens: give the type room */
@media (max-height:830px){.tag{max-height:44svh}}
@media (max-height:680px){.tag{max-height:40svh}}

/* short landscape screens: sit the tag beside the type */
@media (min-width:860px) and (max-height:760px){
  .page{flex-direction:row;gap:clamp(2.5rem,6vw,5rem);text-align:left}
  .tag{max-height:76svh;width:min(280px,28vw);flex:none}
  .status p{margin-left:0;margin-right:0}
  .lockup__rule{margin-left:0}
  .status .mail{margin-top:1rem}
}
</style>
</head>
<body>

<main class="page">
  <figure class="tag">
    <img src="assets/img/tag.webp" alt="Ness — gold script lettering over silk brocade, cherry blossom and a Japanese crane" width="972" height="1619">
  </figure>

  <div>
    <div class="lockup">
      <div class="lockup__rule"></div>
      <h1>Global Group</h1>
      <p class="tagline">Enrich your life with Ness</p>
    </div>

    <div class="status">
      <p>Under construction</p>
      <a class="mail" href="mailto:info@nessglobalgroup.com">info@nessglobalgroup.com</a>
    </div>
  </div>
</main>

<footer class="foot">
  © 2026 Ness Global Group LLC
</footer>

</body>
</html>
