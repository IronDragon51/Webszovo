<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Az oldal nem található — Webszövő</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232D5A27'/><text y='72' x='50' text-anchor='middle' font-size='58' font-family='sans-serif' fill='white' font-weight='bold'>W</text></svg>">
    <style>
        .notfound { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
        .notfound-inner { max-width: 520px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
        .notfound-code { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
        .notfound p { color: var(--text-muted); }
    </style>
</head>

<body>
    <main class="notfound">
        <div class="notfound-inner">
            <a href="/" class="logo">Web<span>szövő</span></a>
            <div class="notfound-code">404</div>
            <h1>Ez az oldal nem található</h1>
            <p>Lehet, hogy a link elavult, vagy elírás van a címben.</p>
            <a href="/" class="btn-primary">Vissza a főoldalra</a>
        </div>
    </main>
</body>

</html>
